<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <title>{{ page.title }} | {{ site.title }}</title>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.favicon_dark }}" type="image/png" />
    <link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.favicon }}" type="image/png" />
    <script src="{{ "/assets/js/favicon-switcher.js" | relative_url }}" type="application/javascript"></script>

    <link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw=" crossorigin=anonymous>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    {% if site.font == "Sans Serif" %}
    <link rel="stylesheet" href="{{ "/assets/css/font_sans_serif.css" | relative_url }}">
    {% else %}
    <link rel="stylesheet" href="{{ "/assets/css/font.css" | relative_url }}">
    {% endif %}
    {% if site.auto_dark_mode %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    {% else %}
    <link rel="stylesheet" href="{{ "/assets/css/style-no-dark-mode.css" | relative_url }}">
    {% endif %}

    <style>
      body { margin: 0; padding: 0; }

      .post-page { max-width: 860px; margin: 0 auto; padding: 2rem 2rem 4rem; }

      .post-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; padding-bottom: 1rem; border-bottom: 1px solid #e8e8e8; }
      .post-topbar-site { font-weight: 700; font-size: 1.1rem; text-decoration: none; color: inherit; }
      .post-topbar-site:hover { color: var(--global-theme-color); }
      .back-link { font-size: 0.95rem; text-decoration: none; color: var(--global-text-color-light); }
      .back-link:hover { color: var(--global-theme-color); }

      .post-header { margin-bottom: 2rem; }
      .post-title { font-size: 2rem; font-weight: 700; line-height: 1.3; margin: 0 0 0.3rem; }
      .post-subtitle { font-size: 1.5rem; font-weight: 400; color: var(--global-text-color-light); margin: 0 0 0.6rem; }
      .post-meta { font-size: 1.35rem; color: var(--global-text-color-light); }

      .post-body { font-size: 1.35rem; line-height: 1.8; }
      .post-body h2 { margin-top: 2.5rem; }
      .post-body h3 { margin-top: 2rem; }
      .post-body p { margin: 1.1rem 0; }

      mjx-container:not([display="true"]) { display: inline !important; }

      @media (prefers-color-scheme: dark) {
        .post-topbar { border-bottom-color: #444; }
      }
    </style>
  </head>
  <body>
    <div class="post-page">
      <div class="post-topbar">
        <a class="post-topbar-site" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <a class="back-link" href="{{ "/" | relative_url }}">&#8592; Back to Home</a>
      </div>
      <div class="post-header">
        <div class="post-title">{{ page.title }}</div>
        {% if page.subtitle %}<div class="post-subtitle">{{ page.subtitle }}</div>{% endif %}
        <div class="post-meta">{{ page.date | date: "%B %d, %Y" }}</div>
      </div>
      <div class="post-body">
        {{ content }}
      </div>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$']],
          displayMath: [['$$', '$$']],
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  </body>
</html>
